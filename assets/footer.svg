<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .footer {
          width: 800px;
          height: 100px;
          background: #0d1117;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
          position: relative;
          overflow: hidden;
        }

        .footer::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 1px;
          background: linear-gradient(90deg, transparent 0%, rgba(99, 102, 241, 0.2) 50%, transparent 100%);
        }

        .quote {
          font-size: 12px;
          color: #484f58;
          letter-spacing: 0.5px;
          font-style: italic;
          opacity: 0;
          animation: fadeUp 1s ease 0.3s forwards;
        }

        .quote .hl {
          color: #7d8590;
        }

        .sig {
          font-size: 11px;
          color: #30363d;
          letter-spacing: 2px;
          opacity: 0;
          animation: fadeUp 1s ease 0.6s forwards;
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 0.8; transform: translateY(0); }
        }
      </style>

      <div class="footer">
        <div class="quote">"The best way to predict the future is to <span class="hl">build</span> it."</div>
        <div class="sig">- - - NIGHT EDGE - - -</div>
      </div>
    </div>
  </foreignObject>
</svg>
