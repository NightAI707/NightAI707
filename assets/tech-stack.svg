<svg fill="none" viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .wrapper {
          width: 800px;
          height: 120px;
          background: #0d1117;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 12px;
          padding: 0 32px;
          font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        .chip {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 7px 14px;
          border-radius: 8px;
          background: rgba(22, 27, 34, 0.9);
          border: 1px solid #21262d;
          font-size: 12px;
          font-weight: 400;
          color: #c9d1d9;
          letter-spacing: 0.3px;
          opacity: 0;
          animation: chipIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          transition: border-color 0.3s;
        }

        .chip:nth-child(1) { animation-delay: 0.1s; }
        .chip:nth-child(2) { animation-delay: 0.2s; }
        .chip:nth-child(3) { animation-delay: 0.3s; }
        .chip:nth-child(4) { animation-delay: 0.4s; }
        .chip:nth-child(5) { animation-delay: 0.5s; }
        .chip:nth-child(6) { animation-delay: 0.6s; }
        .chip:nth-child(7) { animation-delay: 0.7s; }
        .chip:nth-child(8) { animation-delay: 0.8s; }

        .indicator {
          width: 6px;
          height: 6px;
          border-radius: 50%;
        }

        .py { border-color: rgba(53, 114, 165, 0.3); }
        .py .indicator { background: #3572A5; }
        .js { border-color: rgba(241, 224, 90, 0.2); }
        .js .indicator { background: #f1e05a; }
        .ts { border-color: rgba(49, 120, 198, 0.3); }
        .ts .indicator { background: #3178c6; }
        .lua { border-color: rgba(0, 0, 128, 0.3); }
        .lua .indicator { background: #6a6aff; }
        .react-c { border-color: rgba(97, 218, 251, 0.2); }
        .react-c .indicator { background: #61dafb; }
        .node { border-color: rgba(63, 185, 80, 0.2); }
        .node .indicator { background: #3fb950; }
        .docker-c { border-color: rgba(13, 183, 237, 0.2); }
        .docker-c .indicator { background: #0db7ed; }
        .git-c { border-color: rgba(240, 80, 50, 0.2); }
        .git-c .indicator { background: #f05032; }

        @keyframes chipIn {
          from { opacity: 0; transform: translateY(6px); }
          to { opacity: 1; transform: translateY(0); }
        }
      </style>

      <div class="wrapper">
        <div class="chip py"><div class="indicator"></div> Python</div>
        <div class="chip js"><div class="indicator"></div> JavaScript</div>
        <div class="chip ts"><div class="indicator"></div> TypeScript</div>
        <div class="chip lua"><div class="indicator"></div> Lua</div>
        <div class="chip react-c"><div class="indicator"></div> React</div>
        <div class="chip node"><div class="indicator"></div> Node.js</div>
        <div class="chip docker-c"><div class="indicator"></div> Docker</div>
        <div class="chip git-c"><div class="indicator"></div> Git</div>
      </div>
    </div>
  </foreignObject>
</svg>
