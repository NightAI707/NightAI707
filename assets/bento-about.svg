    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="478" height="228" rx="20" fill="url(#glassBg)" stroke="url(#glassRim)" stroke-width="1.2"/>
  <line x1="24" y1="2" x2="456" y2="2" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.9"/>

