<svg fill="none" viewBox="0 0 840 196" width="100%" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111824" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#080c12" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040609" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="cyanAura" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="838" height="194" rx="22" fill="url(#glassBg)" stroke="url(#glassRim)" stroke-width="1.2"/>
  <rect x="1" y="1" width="838" height="194" rx="22" fill="url(#cyanAura)"/>
  <line x1="28" y1="2" x2="812" y2="2" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1"/>

  <!-- Subtle Traffic / Window Indicator Dots -->
  <circle cx="34" cy="28" r="3.5" fill="#22d3ee" fill-opacity="0.85"/>
  <circle cx="48" cy="28" r="3.5" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="62" cy="28" r="3.5" fill="#ffffff" fill-opacity="0.12"/>
  <text x="80" y="31.5" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" letter-spacing="1.2">night-edge // profile</text>

  <!-- Main Identity -->
  <text x="34" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="700" letter-spacing="-1.2" fill="#f8fafc">Night Edge</text>
  <text x="36" y="116" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">AI Engineer and Founder at <tspan fill="#22d3ee" font-weight="600">Elera AI</tspan>. Studying at <tspan fill="#e2e8f0" font-weight="500">IIT Patna</tspan>.</text>

  <!-- Frosted Glass Pills -->
  <g transform="translate(34, 138)">
    <rect width="124" height="28" rx="14" fill="#00e5ff" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.38" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#00e5ff" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#cffafe">ELERA AI</text>

    <rect x="134" width="126" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="197" y="18" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">GENERATIVE AI</text>

    <rect x="270" width="120" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="330" y="18" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#cbd5e1">OPEN SOURCE</text>
  </g>

