<svg fill="none" viewBox="0 0 840 62" width="100%" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="cardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="meshWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="52%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="tideArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="stackSpot" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="60" y="5" width="720" height="52" rx="26" fill="#050507" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.1"/>
  <line x1="90" y1="6" x2="750" y2="6" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.8"/>

  <!-- Left Live Status -->
  <circle cx="92" cy="31" r="5" fill="#30d158" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">Elera AI</text>
  <text x="108" y="43" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="10.5" fill="#8e8e93">In Active Development</text>

  <!-- Center Multi-Hue Waveform -->
  <rect x="400" y="27.0" width="3.5" height="8" rx="1.75" fill="#ff2d55"><animate attributeName="height" values="8;6;8" dur="1.10s" repeatCount="indefinite"/><animate attributeName="y" values="27.0;28.0;27.0" dur="1.10s" repeatCount="indefinite"/></rect><rect x="407" y="23.0" width="3.5" height="16" rx="1.75" fill="#ff5e3a"><animate attributeName="height" values="16;8;16" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="23.0;27.0;23.0" dur="1.25s" repeatCount="indefinite"/></rect><rect x="414" y="19.0" width="3.5" height="24" rx="1.75" fill="#ff9f0a"><animate attributeName="height" values="24;16;24" dur="1.40s" repeatCount="indefinite"/><animate attributeName="y" values="19.0;23.0;19.0" dur="1.40s" repeatCount="indefinite"/></rect><rect x="421" y="24.0" width="3.5" height="14" rx="1.75" fill="#30d158"><animate attributeName="height" values="14;6;14" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="24.0;28.0;24.0" dur="1.55s" repeatCount="indefinite"/></rect><rect x="428" y="20.0" width="3.5" height="22" rx="1.75" fill="#0a84ff"><animate attributeName="height" values="22;14;22" dur="1.70s" repeatCount="indefinite"/><animate attributeName="y" values="20.0;24.0;20.0" dur="1.70s" repeatCount="indefinite"/></rect><rect x="435" y="25.0" width="3.5" height="12" rx="1.75" fill="#bf5af2"><animate attributeName="height" values="12;6;12" dur="1.85s" repeatCount="indefinite"/><animate attributeName="y" values="25.0;28.0;25.0" dur="1.85s" repeatCount="indefinite"/></rect><rect x="442" y="22.0" width="3.5" height="18" rx="1.75" fill="#ff2d55"><animate attributeName="height" values="18;10;18" dur="2.00s" repeatCount="indefinite"/><animate attributeName="y" values="22.0;26.0;22.0" dur="2.00s" repeatCount="indefinite"/></rect>

  <!-- Right Live Streak Ring -->
  <text x="708" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12.5" font-weight="600" fill="#f5f5f7">0d Streak</text>
  <text x="708" y="43" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="10.5" fill="#8e8e93">3 commits</text>
  <circle cx="740" cy="31" r="12" stroke="#1c1c1e" stroke-width="3.5" fill="none"/>
  <circle cx="740" cy="31" r="12" stroke="#0a84ff" stroke-width="3.5" stroke-linecap="round" fill="none"
          stroke-dasharray="11.3 75.4" transform="rotate(-90 740 31)"/>
</svg>
