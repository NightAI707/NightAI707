<svg fill="none" viewBox="0 0 840 74" width="100%" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="cardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="meshWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="52%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="tideArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="stackSpot" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <defs>
    <clipPath id="diClip">
      <rect x="80.0" y="6.0" width="680" height="62" rx="31.0"/>
    </clipPath>
    <linearGradient id="diGlassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="diGlowL" cx="15%" cy="95%" r="40%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="diGlowR" cx="85%" cy="95%" r="40%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Liquid Glass Dynamic Island Capsule -->
  <g clip-path="url(#diClip)">
    <rect x="80.0" y="6.0" width="680" height="62" fill="#050507"/>
    <rect x="80.0" y="6.0" width="680" height="62" fill="url(#diGlowL)"/>
    <rect x="80.0" y="6.0" width="680" height="62" fill="url(#diGlowR)"/>
    <ellipse cx="420.0" cy="12.0" rx="285.59999999999997" ry="10" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <rect x="80.0" y="6.0" width="680" height="62" rx="31.0" fill="none" stroke="url(#diGlassRim)" stroke-width="1.3"/>

  <!-- Left: Live Dot + Elera Script Logo + Subtitle -->
  <circle cx="106.0" cy="37.0" r="4.5" fill="#30d158" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <image href="data:image/png;base64," x="122.0" y="15.0" width="62" height="25"/>
  <text x="122.0" y="55.0" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="10" fill="#8e8e93">In Active Development</text>

  <!-- Center: Apple Waveform -->
  <rect x="396.0" y="33.0" width="3.6" height="8" rx="1.8" fill="#ff2d55"><animate attributeName="height" values="8;6;8" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="33.0;34.0;33.0" dur="1.05s" repeatCount="indefinite"/></rect><rect x="403.5" y="29.0" width="3.6" height="16" rx="1.8" fill="#ff5e3a"><animate attributeName="height" values="16;6;16" dur="1.19s" repeatCount="indefinite"/><animate attributeName="y" values="29.0;34.0;29.0" dur="1.19s" repeatCount="indefinite"/></rect><rect x="411.0" y="24.0" width="3.6" height="26" rx="1.8" fill="#ff9f0a"><animate attributeName="height" values="26;16;26" dur="1.33s" repeatCount="indefinite"/><animate attributeName="y" values="24.0;29.0;24.0" dur="1.33s" repeatCount="indefinite"/></rect><rect x="418.5" y="30.0" width="3.6" height="14" rx="1.8" fill="#30d158"><animate attributeName="height" values="14;6;14" dur="1.47s" repeatCount="indefinite"/><animate attributeName="y" values="30.0;34.0;30.0" dur="1.47s" repeatCount="indefinite"/></rect><rect x="426.0" y="25.0" width="3.6" height="24" rx="1.8" fill="#0a84ff"><animate attributeName="height" values="24;14;24" dur="1.61s" repeatCount="indefinite"/><animate attributeName="y" values="25.0;30.0;25.0" dur="1.61s" repeatCount="indefinite"/></rect><rect x="433.5" y="28.0" width="3.6" height="18" rx="1.8" fill="#bf5af2"><animate attributeName="height" values="18;8;18" dur="1.75s" repeatCount="indefinite"/><animate attributeName="y" values="28.0;33.0;28.0" dur="1.75s" repeatCount="indefinite"/></rect><rect x="441.0" y="32.0" width="3.6" height="10" rx="1.8" fill="#ff2d55"><animate attributeName="height" values="10;6;10" dur="1.89s" repeatCount="indefinite"/><animate attributeName="y" values="32.0;34.0;32.0" dur="1.89s" repeatCount="indefinite"/></rect>

  <!-- Right: Streak + Activity Ring -->
  <text x="708.0" y="34.0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" fill="#f5f5f7">0d Streak</text>
  <text x="708.0" y="52.0" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="10.5" fill="#8e8e93">3 commits</text>
  <circle cx="732.0" cy="37.0" r="13" stroke="#1c1c1e" stroke-width="3.6" fill="none"/>
  <circle cx="732.0" cy="37.0" r="13" stroke="#0a84ff" stroke-width="3.6" stroke-linecap="round" fill="none"
          stroke-dasharray="13.1 81.7" transform="rotate(-90 732.0 37.0)"/>
</svg>
