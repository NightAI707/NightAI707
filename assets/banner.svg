<svg fill="none" viewBox="0 0 900 210" width="900" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orb1" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0891b2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="35%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="specularSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="blurHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bannerClip">
      <rect x="2" y="2" width="896" height="206" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Pure Obsidian Black Base -->
    <rect width="900" height="210" fill="#000000"/>

    <!-- Ambient Liquid Cyan Orbs -->
    <ellipse cx="220" cy="80" rx="260" ry="130" fill="url(#orb1)" filter="url(#blurHeavy)">
      <animate attributeName="cx" values="200;290;200" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75;120;75" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="135" rx="240" ry="120" fill="url(#orb2)" filter="url(#blurHeavy)">
      <animate attributeName="cx" values="720;630;720" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;85;140" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Subtle Technical Grid -->
    <path d="M0 52 H900 M0 105 H900 M0 158 H900 M150 0 V210 M300 0 V210 M450 0 V210 M600 0 V210 M750 0 V210"
          stroke="#22d3ee" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Frosted Liquid Glass Surface -->
    <rect x="18" y="18" width="864" height="174" rx="20" fill="url(#glassPane)" stroke="url(#rimHighlight)" stroke-width="1.2"/>

    <!-- Top Specular Glass Reflection Arc -->
    <path d="M38 19 H862" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="-250" y="18" width="220" height="174" fill="url(#specularSweep)" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1100" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Right Liquid Glass Geometric Core -->
    <g transform="translate(745, 105)">
      <circle r="54" fill="#00f0ff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1"/>
      <circle r="40" fill="none" stroke="#a5f3fc" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="14 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="26" fill="#00f0ff" fill-opacity="0.10" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="1.2" filter="url(#glowCyan)"/>
      <polygon points="0,-16 14,0 0,16 -14,0" fill="#a5f3fc" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Main Typography -->
    <text x="56" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5" fill="url(#cyanText)">NIGHT EDGE</text>
    <text x="58" y="118" font-family="'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3.5" fill="#67e8f9" fill-opacity="0.88">AI ENGINEER  /  FOUNDER @ ELERA AI</text>

    <!-- Glass Pill Badges -->
    <g transform="translate(56, 138)">
      <rect width="104" height="26" rx="13" fill="#00f0ff" fill-opacity="0.09" stroke="#22d3ee" stroke-opacity="0.38" stroke-width="1"/>
      <text x="52" y="17" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#e0f2fe">IIT PATNA</text>

      <rect x="114" width="128" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
      <text x="178" y="17" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#cffafe">GEN-AI SYSTEMS</text>

      <rect x="252" width="118" height="26" rx="13" fill="#00f0ff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.30" stroke-width="1"/>
      <circle cx="268" cy="13" r="3.5" fill="#00f0ff" filter="url(#glowCyan)">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="318" y="17" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#67e8f9">BUILDING</text>
    </g>
  </g>
</svg>
