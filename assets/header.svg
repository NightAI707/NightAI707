<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container {
          width: 800px;
          height: 200px;
          background: #0d1117;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 48px;
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        .container::before {
          content: '';
          position: absolute;
          top: -60%;
          left: -20%;
          width: 140%;
          height: 220%;
          background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
          animation: drift 12s ease-in-out infinite alternate;
        }

        @keyframes drift {
          0% { transform: translate(0, 0) rotate(0deg); }
          100% { transform: translate(30px, -10px) rotate(2deg); }
        }

        .grid-lines {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
          background-size: 40px 40px;
        }

        .left {
          display: flex;
          flex-direction: column;
          gap: 10px;
          z-index: 2;
          opacity: 0;
          animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .name {
          font-size: 32px;
          font-weight: 600;
          letter-spacing: -1px;
          color: #f0f6fc;
          line-height: 1;
        }

        .tagline {
          font-size: 14px;
          font-weight: 400;
          color: #7d8590;
          letter-spacing: 0.3px;
          line-height: 1.4;
        }

        .accent {
          color: #a78bfa;
        }

        .tags {
          display: flex;
          gap: 8px;
          margin-top: 4px;
        }

        .tag {
          font-size: 11px;
          font-weight: 500;
          color: #c9d1d9;
          background: rgba(99, 102, 241, 0.1);
          border: 1px solid rgba(99, 102, 241, 0.15);
          padding: 3px 10px;
          border-radius: 12px;
          letter-spacing: 0.5px;
        }

        .right {
          z-index: 2;
          text-align: right;
          opacity: 0;
          animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .meta {
          font-size: 11px;
          font-family: 'SF Mono', 'Fira Code', monospace;
          color: #484f58;
          line-height: 1.8;
        }

        .meta .val {
          color: #7d8590;
        }

        .status {
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 6px;
          margin-top: 10px;
        }

        .dot {
          width: 7px;
          height: 7px;
          background: #3fb950;
          border-radius: 50%;
          animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.4); }
          50% { box-shadow: 0 0 0 5px rgba(63, 185, 80, 0); }
        }

        .status-text {
          font-size: 11px;
          font-family: 'SF Mono', 'Fira Code', monospace;
          color: #3fb950;
          letter-spacing: 1px;
        }

        .line-top, .line-bottom {
          position: absolute;
          left: 0;
          right: 0;
          height: 1px;
          z-index: 3;
        }

        .line-top {
          top: 0;
          background: linear-gradient(90deg, transparent 0%, rgba(99, 102, 241, 0.3) 50%, transparent 100%);
        }

        .line-bottom {
          bottom: 0;
          background: linear-gradient(90deg, transparent 0%, rgba(99, 102, 241, 0.2) 50%, transparent 100%);
        }

        @keyframes slideIn {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
      </style>

      <div class="container">
        <div class="grid-lines"></div>
        <div class="line-top"></div>
        <div class="line-bottom"></div>

        <div class="left">
          <div class="name">Night Edge</div>
          <div class="tagline">Building at the intersection of <span class="accent">intelligence</span> and <span class="accent">creativity</span></div>
          <div class="tags">
            <span class="tag">AI ENGINEER</span>
            <span class="tag">FOUNDER</span>
            <span class="tag">IIT PATNA</span>
          </div>
        </div>

        <div class="right">
          <div class="meta">
            <div>SYS <span class="val">night.edge</span></div>
            <div>ORG <span class="val">elera.ai</span></div>
            <div>LOC <span class="val">IN / ASIA</span></div>
          </div>
          <div class="status">
            <div class="dot"></div>
            <span class="status-text">ACTIVE</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
