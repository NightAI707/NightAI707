<svg fill="none" viewBox="0 0 274 68" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip_linkedin">
      <rect x="1.5" y="1.5" width="271" height="65" rx="32.5"/>
    </clipPath>
    <radialGradient id="gl_linkedin" cx="18%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#0a84ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr_linkedin" cx="85%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#bf5af2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim_linkedin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="blur_linkedin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <g clip-path="url(#clip_linkedin)">
    <rect width="274" height="68" fill="#08080a"/>
    <ellipse cx="48" cy="58" rx="95" ry="42" fill="url(#gl_linkedin)" filter="url(#blur_linkedin)"/>
    <ellipse cx="232" cy="58" rx="88" ry="40" fill="url(#gr_linkedin)" filter="url(#blur_linkedin)"/>
    <!-- Subtle inner glass sheen -->
    <ellipse cx="137.0" cy="10" rx="115.08" ry="14" fill="#ffffff" fill-opacity="0.06"/>
  </g>
  <rect x="1.5" y="1.5" width="271" height="65" rx="32.5" fill="none" stroke="url(#rim_linkedin)" stroke-width="1.3"/>
  <text x="28" y="39.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="17" font-weight="500" letter-spacing="-0.2" fill="#f5f5f7">LinkedIn</text>
  <!-- White Circle + Arrow -->
  <circle cx="240" cy="34.0" r="21" fill="#ffffff"/>
  <path d="M232 34.0 H248 M242 28.0 L248 34.0 L242 40.0" stroke="#bf5af2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
